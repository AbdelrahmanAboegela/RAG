name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (standard library only)
        run: python -m unittest discover -s code/tests -v
      - name: Run all examples
        run: for f in code/examples/0*.py; do echo "== $f"; python "$f" > /dev/null; done
      - name: Internal links and anchors
        run: python tools/check_links.py
      - name: Paper index consistency
        run: python tools/validate_papers.py
      - name: Execute the tour notebook
        run: python tools/run_notebook.py code/notebooks/ragkit_tour.ipynb
